name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 拉取仓库代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 设置 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 设置 Java 17 (匹配 Gradle)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 4. 一次性补全所有 Linux 底层编译依赖包
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          autoconf \
          automake \
          libtool \
          pkg-config \
          cmake \
          zip \
          unzip \
          libssl-dev \
          libffi-dev \
          libsqlite3-dev \
          patch \
          lld

    # 5. 安装 Python 构建工具（强制锁定 Cython < 3.0.0 避免编译死锁）
    - name: Install Python Build Tools
      run: |
        pip install --upgrade pip setuptools wheel
        pip install "cython<3.0.0" "buildozer>=1.5.0"

    # 6. 执行 Buildozer 打包（用 yes 自动通过所有 SDK/NDK 交互式许可）
    - name: Build APK with Buildozer
      run: |
        yes | buildozer -s android debug

    # 7. 上传生成的 APK 文件
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IPWeather-debug-apk
        path: bin/*.apk
