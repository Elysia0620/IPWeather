name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 拉取仓库代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 设置 Python 环境 (使用 Python 3.10)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 关键步骤：设置 Java 17 (解决 Gradle 报错的关键)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 4. 安装 Buildozer 所需的系统依赖与 Python 库
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libffi-dev libssl-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixin-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev autoconf automake libtool ccache
        pip install --upgrade pip setuptools wheel
        pip install buildozer cython

    # 5. 使用 Buildozer 打包 APK
    - name: Build with Buildozer
      run: |
        buildozer -s android debug

    # 6. 上传生成的 APK 文件到 GitHub Actions Artifacts (方便直接下载)
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: IPWeather-debug-apk
        path: bin/*.apk
