name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev zip unzip openjdk-17-jdk
        python -m pip install --upgrade pip
        pip install "buildozer<2.0.0" "cython<3.0.0"

    - name: Build APK with Buildozer
      env:
        # 直接使用系统预装的 Android SDK/NDK 路径，彻底解决 sdkmanager 不存在的问题
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        APP_ANDROID_ACCEPT_SDK_LICENSES: 1
      run: |
        # 1. 自动同意 GitHub 系统预装 SDK 的所有 License
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

        # 2. 直接读取仓库根目录下的 buildozer.spec 进行打包
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: IPWeather-APK
        path: bin/*.apk
