name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev zip unzip openjdk-17-jdk
        python -m pip install --upgrade pip
        pip install "buildozer<2.0.0" "cython<3.0.0"

    - name: Build APK with Buildozer
      env:
        # 自动同意 SDK 许可的关键环境变量
        APP_ANDROID_ACCEPT_SDK_LICENSES: 1
      run: |
        # 1. 初始化配置文件
        buildozer init

        # 2. 修改应用基本配置
        sed -i 's/title = My Application/title = IP天气追踪器/g' buildozer.spec
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy,requests,urllib3,chardet,idna,certifi/g' buildozer.spec
        sed -i 's/# android.permissions = INTERNET/android.permissions = INTERNET/g' buildozer.spec

        # 3. 指定兼容性最好的 Android NDK 版本，避免下载 r28 导致不兼容
        sed -i 's/# android.ndk = 25b/android.ndk = 25b/g' buildozer.spec

        # 4. 执行打包（加入 yes 管道流，双重保障自动接受所有 license 弹窗）
        yes | buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: IPWeather-APK
        path: bin/*.apk
