name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # 核心修复：必须指定 ubuntu-22.04，不能用最新的 ubuntu-24.04
    runs-on: ubuntu-22.04

    steps:
    # 1. 拉取仓库代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 设置 Python 3.10 环境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 设置 Java 17 (JDK)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 4. 安装 Linux 构建依赖
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          autoconf \
          automake \
          libtool \
          pkg-config \
          cmake \
          zip \
          unzip \
          libssl-dev \
          libffi-dev \
          libsqlite3-dev \
          patch \
          lld

    # 5. 安装 Python 打包依赖 (严格锁定 Cython < 3.0.0)
    - name: Install Python Build Tools
      run: |
        pip install --upgrade pip setuptools wheel
        pip install "cython<3.0.0" buildozer

    # 6. 执行 Buildozer 打包
    - name: Build APK with Buildozer
      env:
        ACCEPT_BUILD_TOOLS_CHECKSUMS: true
      run: |
        buildozer -s android debug

    # 7. 上传编译好的 APK
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IPWeather-debug-apk
        path: bin/*.apk
